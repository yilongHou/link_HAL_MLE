[project]
name = "hal-mle-fd"
version = "0.1.0"
description = ""
authors = []
requires-python = ">=3.10"
dependencies = [
    "cvxpy==1.7.1",
    "ecos>=2.0.12",
    "jupyter>=1.1.1",
    "matplotlib==3.10.0",
    "mosek==11.0.27",
    "numpy==1.26.4",
    "optuna==4.4.0",
    "pandas==2.2.3",
    "plotly>=6.2.0",
    "scikit-learn>=1.7.0",
    "scipy==1.15.3",
    "seaborn>=0.13.2",
    "torch==2.5.1",
    "tqdm-joblib>=0.0.5",
]

[project.optional-dependencies]
